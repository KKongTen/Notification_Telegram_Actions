name: Auto Register Notification from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register-schedule:
    if: contains(github.event.issue.labels.*.name, 'notification-schedule') || startsWith(github.event.issue.title, '[예약]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Issue Data & Update schedules.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python scripts/add_from_issue.py

      - name: Run Immediate Notification Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/data/schedules.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(issue): auto add schedule from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **텔레그램 알림 예약이 성공적으로 저장되었습니다!**\n지정하신 예약 시간에 텔레그램 메세지가 전송됩니다 📱'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
