name: Telegram Scheduled Notifier

on:
  schedule:
    # 30분 주기 실행 (월 1,440분 소비 - 월 2,000분 무료 한도 내)
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telegram Notification Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify.py

      - name: Commit and Push changes if schedules.json updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/data/schedules.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(notification): update schedules status [skip ci]"
            git push
          fi
